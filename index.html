    <script>
  let deferredPrompt;

  // Detecta el evento 'beforeinstallprompt' cuando la app es instalable
  window.addEventListener('beforeinstallprompt', (event) => {
    // Evita que el navegador muestre el aviso automático
    event.preventDefault();
    deferredPrompt = event;

    // Muestra un botón o mensaje para que el usuario instale la PWA
    const installButton = document.createElement('button');
    installButton.innerText = 'Instalar App';
    installButton.style = 'position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background-color: #00b09b; color: white; border: none; border-radius: 5px;';
    document.body.appendChild(installButton);

    // Al hacer clic en el botón, mostramos el prompt de instalación
    installButton.addEventListener('click', () => {
      installButton.style.display = 'none'; // Oculta el botón después de que el usuario lo presiona
      deferredPrompt.prompt(); // Muestra el diálogo de instalación
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Usuario aceptó la instalación');
        } else {
          console.log('Usuario rechazó la instalación');
        }
        deferredPrompt = null;
      });
    });
  });
</script>
