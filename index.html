<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Document</title>
   <style>
    body {
        background-image: linear-gradient(to right, #a18cd1, #fbc2eb); /* lavanda a rosa claro */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    h1 {
        font-size: 32px;
        color: #ffffff;
        margin-bottom: 20px;
        text-align: center;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    div {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 80%;
        max-width: 400px;
    }

    a {
        text-decoration: none;
    }

    a.button-link {
        display: block;
        background-color: #ff9a8b; /* coral suave */
        color: #ffffff;
        border: 2px solid #f37272;
        border-radius: 12px;
        padding: 15px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        text-align: center;
    }

    a.button-link:hover {
        background-color: #f37272;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    button {
        background-color: #8ec5fc; /* azul suave */
        color: #ffffff;
        border: 2px solid #61a4f1;
        border-radius: 12px;
        padding: 15px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    button:hover {
        background-color: #61a4f1;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 24px;
        }

        button,
        a.button-link {
            font-size: 14px;
            padding: 12px;
        }
    }

    footer {
        background-color: transparent;
        color: #ffffff;
        text-align: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        position: fixed;
        width: 100%;
        bottom: 0;
    }

    footer h1 {
        font-size: 16px;
        font-weight: normal;
        margin: 0;
    }

    footer h1 span {
        font-weight: bold;
        color: #ffe0f0; /* rosado claro */
    }
</style>

</head>
<body>
    <!-- Título estilizado -->
    <h1>Bienvenido Pablo</h1>
    
    <div>
        <!-- Enlace estilizado como botón -->
        <a href="https://docs.google.com/spreadsheets/d/14VtmRlGT6zJZfDvMwxPEGEcrtyxnG36I/edit?usp=drivesdk&ouid=112025782906316168552&rtpof=true&sd=true" target="_blank" class="button-link">
            ITAKYRY
        </a>
        <button>PRÓXIMAMENTE...</button>
        <button>PRÓXIMAMENTE...</button>
        <button>PRÓXIMAMENTE...</button>
        <button>PRÓXIMAMENTE...</button>
    </div>
    <script>
  let deferredPrompt;

  // Detecta el evento 'beforeinstallprompt' cuando la app es instalable
  window.addEventListener('beforeinstallprompt', (event) => {
    // Evita que el navegador muestre el aviso automático
    event.preventDefault();
    deferredPrompt = event;

    // Muestra un botón o mensaje para que el usuario instale la PWA
    const installButton = document.createElement('button');
    installButton.innerText = 'Instalar App';
    installButton.style = 'position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background-color: #00b09b; color: white; border: none; border-radius: 5px;';
    document.body.appendChild(installButton);

    // Al hacer clic en el botón, mostramos el prompt de instalación
    installButton.addEventListener('click', () => {
      installButton.style.display = 'none'; // Oculta el botón después de que el usuario lo presiona
      deferredPrompt.prompt(); // Muestra el diálogo de instalación
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('Usuario aceptó la instalación');
        } else {
          console.log('Usuario rechazó la instalación');
        }
        deferredPrompt = null;
      });
    });
  });
</script>
     <footer>
        <h1>&copy; Hecho por <span>Juan Alfonso</span></h1>
    </footer>
</body>
</html>
